[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "time-machine-news"
version = "0.1.0"
description = "MCP server that lets Claude explore historical US newspapers from the Library of Congress."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ronak Rupani" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "httpx",
    "upstash-redis",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
time-machine-news = "time_machine_news.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/time_machine_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
